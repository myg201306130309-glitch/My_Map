<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyMap · 회원가입 준비</title><link rel="stylesheet" href="style.css"></head><body><header><a id="brand" href="./"><span class="brand-mark">M</span><strong>MyMap</strong></a></header><main class="narrow"><h1>회원가입 준비 중입니다</h1><p>인증 서버 연결 전의 화면 검토용입니다. 실제 이메일과 비밀번호를 입력하거나 저장할 수 없습니다. 현재는 회원가입 없이 고민 정리를 이용하실 수 있습니다.</p><section class="panel"><fieldset disabled><legend>가입 시 사용할 항목</legend><label>연령대<select><option>선택해 주세요</option><option>10대</option><option>20대</option><option>30대</option><option>40대</option><option>50대</option><option>60대 이후</option></select></label><label>이메일<input type="email" autocomplete="off"></label><label>비밀번호<input type="password" autocomplete="new-password"></label><button>회원가입</button></fieldset><p>비밀번호 원문을 MyMap의 기록이나 분석 데이터에 저장하지 않습니다.</p></section><p>현재 검토 범위는 성인입니다. 10대의 이용 범위와 필요한 절차는 정식 회원가입을 열기 전에 확정합니다.</p><a class="link-button" href="career.html">회원가입 없이 고민 정리하기</a></main></body></html>
